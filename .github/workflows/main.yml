name: Sass Build

on:
  push:
    branches: [src-pages]
  pull_request:
    branches: [src-pages]

jobs:
  build_css:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source Git branch
        uses: actions/checkout@v3
        with:
          ref: src-pages
          fetch-depth: 10

      - name: Make destination directory for compiled CSS
        run: mkdir -vp /tmp/assets/css

      - name: Compile CSS from SCSS files
        uses: gha-utilities/sass-build@v0.2.2
        with:
          source: assets/css/styles.scss
          destination: /tmp/assets/css/styles.css

      - name: Upload Complied CSS
        uses: actions/upload-artifact@v4
        with:
          name: styles-artifact
          path: /tmp/assets/css/styles.css

  release_css:
    needs: [build_css]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination Git branch
        uses: actions/checkout@v3
        with:
          ref: pr-pages
          fetch-depth: 3

      - name: Download Compiled CSS
        uses: actions/download-artifact@v4.1.7
        with:
          name: styles-artifact
          path: assets/css

      - run: |
          ls -lar assets/css
          git status
          echo ${{ github.sha }} > release.md

      - name: Add and Commit changes to pr-pages branch
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add .
          git diff-index --quiet HEAD || git commit -m 'Updates compiled CSS files'

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: pr-pages
          force: true

  deploy:
    needs: [release_css]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: src-pages

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy theme files
        run: |
          target="/home/ghost-mgr/latest"
          rsync -avz -e "ssh -p ${{ secrets.PORT }}" \
            --exclude '.git/' \
            package.json *.hbs partials static assets \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${target}"

      - name: Checkout CSS
        uses: actions/checkout@v3
        with:
          ref: pr-pages

      - name: Deploy CSS files
        run: |
          target="/home/ghost-mgr/latest/assets/css"
          rsync -avvz -e "ssh -p ${{ secrets.PORT }}" \
            assets/css/ \
            "${{ secrets.USERNAME }}@${{ secrets.HOST }}:${target}"

      - name: Restart Ghost
        if: false
        run: |
          # deprecated: ghost manager will reload
          # ssh -p ${{ secrets.PORT }} ${{ secrets.USERNAME }}@${{ secrets.HOST }} ' sudo systemctl restart ghost'
